# ddos-tool example — points at the local dev server (scripts/dev_server.py)
target: http://127.0.0.1:8099/
attack: http            # http | udp | syn (syn = mid-term, needs root/CAP_NET_RAW)
duration_sec: 30
rate:
  rps: 20000            # target ops/sec (token bucket)
workers: 64             # concurrent connections / senders

http:
  method: GET
  path: /
  headers:
    User-Agent: ddos-tool-dev
  body: null

# For UDP, switch to:
#   attack: udp
#   target: 127.0.0.1:9999
#   udp: { size: 512, fill: "x" }
